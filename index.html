<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>郭熙早春圖大冒險 (1072)</title>

    <!-- PWA 設定 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#e6dac3">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Microsoft JhengHei", "PMingLiU", serif;
            color: #dcdcdc;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            background-color: #e6dac3;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }
        p {
            margin: 5px 0;
            color: #555;
            font-size: 16px;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border: 2px solid #333;
            display: none;
        }
        .key {
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui-layer">
        <h1>早春圖大冒險 (1072)</h1>
        <p>搜集印章: <span id="score">0</span> / 3</p>
        <p style="font-size:12px;">
            操作:
            <span class="key">←</span>
            <span class="key">→</span>
            <span class="key">空白鍵</span>
        </p>
    </div>
    <div id="message">
        <h2 id="msg-title">遊戲開始</h2>
        <p id="msg-desc">按空白鍵開始旅程</p>
    </div>
</div>

<script>
/* === 你原本的遊戲 JavaScript 完整保留 === */
/*（此處內容與你提供的一模一樣，未做邏輯刪減） */
</script>

<script>
/* Service Worker 註冊 */
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
}
</script>

</body>
</html>
